<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text-container{
            display: flex;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 4px;
            perspective: 80px;

        }
        .text-container > b {
            height: 70px;
            box-shadow: 0px 6px 5px gray;
            background: linear-gradient(to right, red,green,blue,yellow);
            background-clip: text;
            color: transparent;
            transform-origin: bottom;
            animation: grtupdown 10s infinite;

            
        }
        .text-container>b:nth-child(1){animation-delay: 0s;}
        .text-container>b:nth-child(2){animation-delay: 0.25s;}
        .text-container>b:nth-child(3){animation-delay: 0.50s;}
        .text-container>b:nth-child(4){animation-delay: 0.75s;}
        .text-container>b:nth-child(5){animation-delay: 1s;}
        .text-container>b:nth-child(6){animation-delay: 1.25s;}
        .text-container>b:nth-child(7){animation-delay: 1.50s;}

        @keyframes grtupdown{
            from{ transform:rotatex(-85deg);}
            10%,50%{transform:rotatex(0);}
            60%,to{transform:rotatex(-85deg);}
        }

    </style>
</head>
<body>
    <div  class="text-container">
        <b>P</b><b>R</b><b>A</b><b>J</b><b>W</b><b>A</b><b>L</b>
    </div>
    
</body>
</html>
