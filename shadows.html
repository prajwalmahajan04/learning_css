<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_shadow{
            text-shadow: 2px 8px 7px red;
            color: blue;
            font-size: 40px;
            text-align: center;
        }
        .b_shadow{
            width: 400px;
            box-shadow: 10px 10px 5px blue;
        }
        .b_shadow1{
            width: 400px;
            height: 400px;
            box-shadow: 10px 10px 5px red;
            
        }
        .d_shadow{
            width: 400px;
            filter: drop-shadow(16px 16px 20px blue);
        }
    </style>
</head>
<body>
    <img src="images/bappa.png" class="d_shadow" />
    <img src="images/krishna.png" class="d_shadow" />
    <img src="images/flower.png" class="d_shadow" />
    <h1 class="t_shadow">Prajwal</h1>
    <img src="images/134168452943625068.jpg" alt="" class="d_shadow" />
</body>
</html>
