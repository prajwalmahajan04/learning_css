<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .b_container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-left: 100px;
        }
        .s_box{
            background-color: deeppink;
            color: aliceblue;
            border-radius: 10px;
            height: 20px;
            width: 200px;
            font-size: 20px;
            padding: 20px;
            margin: 20px;
            border: 5px solid gray;
            transition: transform 2s ease-in;
        }
        .b1:hover{
            transform: translate(255px, 100px);
        }
        .b2:hover{
            transform: translatex(200px);
        }
        .b3:hover{
            transform: translatey(200px);
        }
        .b4:hover{
            transform: rotate(720deg);
            background-color: chocolate;
        }
        .b5:hover{
            transform: skew(50deg);
        }
        .b6:hover{
            transform: scale(1,5);
        }
    </style>
</head>
<body>
    <div class="b_container">
        <div class="s_box b1">tranlate</div>
        <div class="s_box b2">translatex</div>
        <div class="s_box b3">translatey</div>
        <div class="s_box b4">rotate</div>
        <div class="s_box b5">skew></div>
        <div class="s_box b6">scale></div>
    
    
</body>
</html>
