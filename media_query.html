<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            @media (min-width:320px) and (max-width:767px){
               body{
                    background-color: aqua ;
               }
               h1{
                    color: red;
               }
               h2{
                    font-size: 30px;
                    text-shadow: 4px 5px 6px blue;
               }
               p{
                    background-color: black;
                    color: white;
                    padding: 20px;
                    border: 4px solid red;
               }
               img{
                    display: none;
               }
            }
            @media (min-width:768px){
                body{
                    background-color: black;
                    color: white;
                }
                h1{
                    color: yellow;
                }
            }
            @media (min-width:1224px){
                body{
                    background-color: green;
                    color: red;
                }
                h1{
                    color: chartreuse;
                }
            }
        </style>
    </head>
    <body>
        <h1>hello welcome to media query example</h1>
        <h2> my name is Prajwal Mahajan </h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ullam optio
            et sint ex voluptatibus, expedita consequuntur incidunt magnam vel
            officiis at cupiditate velit possimus rerum odio, inventore, cumque
            itaque molestias!</p>

            <img src="images/Bappa.g.jpg">

        </body>
    </html>
